# ##############################################################################
# Deploy demo — automatic deployment to Google Cloud Run
# ##############################################################################
# WHAT THIS WORKFLOW DOES
#   On every push to `main` (or a manual run) it:
#     1) runs the CI workflow (ci-docker.yml, job `test-and-docker`) first,
#     2) authenticates to Google Cloud WITHOUT a key file (Workload Identity
#        Federation),
#     3) builds + pushes web (`fasttrack-app`) and jobs (`fasttrack-jobs`)
#        images tagged with the full source commit SHA,
#     4) runs deploy/release.sh (resolve digests -> migrate -> update service),
#     5) smoke-tests the public URL (deploy/smoke_test.py),
#     6) writes a factual deployment summary.
#   MANUAL ROLLBACK: run the workflow by hand and enter `image_tag` = the full
#   40-character commit SHA of an existing web image. Tests, build and
#   migration are skipped; only the service is pointed back to that image.
#
# ⚠️ DO NOT RENAME:
#   - job `test-and-docker` (defined in ci-docker.yml, called by `test` below)
#   - environment : demo
#   - repository/environment variables: GCP_PROJECT_ID, GCP_REGION,
#     WIF_PROVIDER, WIF_SERVICE_ACCOUNT
# ##############################################################################

name: Deploy demo

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Rollback: full commit SHA of an existing image. Empty = test, build and deploy current main.'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  test:
    if: github.ref == 'refs/heads/main' && !inputs.image_tag
    uses: ./.github/workflows/ci-docker.yml

  deploy:
    needs: test
    if: >-
      always() && !cancelled() && github.ref == 'refs/heads/main' &&
      (needs.test.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && inputs.image_tag != '' && needs.test.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: demo
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      SERVICE_NAME: fasttrack-app
      JOBS_IMAGE_NAME: fasttrack-jobs
      MIGRATE_JOB_NAME: fasttrack-migrate
      REGISTRY_REPO: fasttrack-docker
      IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
      ROLLBACK: ${{ inputs.image_tag != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate deployment settings
        env:
          WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ vars.WIF_SERVICE_ACCOUNT }}
        run: |
          test -n "$PROJECT_ID" && test -n "$REGION"
          test -n "$WIF_PROVIDER" && test -n "$WIF_SERVICE_ACCOUNT"
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]] || { echo 'Image tag must be a full 40-character commit SHA.'; exit 1; }

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and push production web and jobs images
        if: env.ROLLBACK != 'true'
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          APP_IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$REGISTRY_REPO/$SERVICE_NAME:$IMAGE_TAG"
          JOBS_IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$REGISTRY_REPO/$JOBS_IMAGE_NAME:$IMAGE_TAG"
          docker build --build-arg RELEASE_SHA="$IMAGE_TAG" --tag "$APP_IMAGE" Project_code
          docker push "$APP_IMAGE"
          docker build --target jobs --build-arg RELEASE_SHA="$IMAGE_TAG" --tag "$JOBS_IMAGE" Project_code
          docker push "$JOBS_IMAGE"

      - name: Verify image, migrate and deploy
        run: bash deploy/release.sh

      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Smoke test public URL
        env:
          EXPECTED_RELEASE_SHA: ${{ env.IMAGE_TAG }}
          SMOKE_EMAIL: ${{ vars.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
        run: python3 deploy/smoke_test.py "$SERVICE_URL"

      - name: Record deployment summary
        run: |
          {
            echo '### fastTrack demo deployment'
            echo "- Commit image tag: \`$IMAGE_TAG\`"
            echo "- Web Digest: \`$DEPLOYED_IMAGE\`"
            echo "- Jobs Digest: \`${DEPLOYED_JOBS_IMAGE:-skipped-rollback}\`"
            echo "- Serving Revision: \`${SERVING_REVISION:-unknown}\`"
            echo "- Rollback: $ROLLBACK"
            echo "- URL: $SERVICE_URL"
            echo '- Smoke test: passed (/api/health version match, /api/ready DB, / HTML, /api/nonexistent 404).'
            echo '- See smoke step for optional authenticated /api/auth/me + /api/teams + logout status.'
          } >> "$GITHUB_STEP_SUMMARY"
